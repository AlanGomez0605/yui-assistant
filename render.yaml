services:
  - type: web
    name: yui-mhcp0001
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: API_TOKEN
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: OWNER_TIMEZONE
        value: "America/Mexico_City"
      - key: OWNER_NAME
        value: "Alan Jahir"
      - key: OWNER_NICKNAME
        value: "Alan"
      - key: OWNER_EMAIL
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
